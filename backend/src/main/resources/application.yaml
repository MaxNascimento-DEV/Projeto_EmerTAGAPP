spring:
  application:
    name: emertagbd

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  datasource:
    url: ${BD_URL:jdbc:mysql://localhost:3306/emertagbd?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  # Base da URL gravada no QR Code. Vazio = usa o endereço pelo qual o app acessou o backend
  # (ex.: app configurado com http://192.168.0.7:8080 gera QR com esse mesmo endereço).
  # Defina APP_URL_PUBLICA só para forçar um domínio fixo (ex.: em produção).
  url-publica: ${APP_URL_PUBLICA:}
  # Pasta onde as fotos enviadas pelo app são salvas (relativa à pasta onde o backend roda)
  uploads-dir: ${APP_UPLOADS_DIR:uploads}

jwt:
  secret: ${JWT_SECRET:chaveSecretaTemporariaDeDesenvolvimentoComPeloMenos32Caracteres}
  expiration-ms: 86400000
